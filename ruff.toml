# Ruff configuration for the abitoads tooling.
#
# The project is a single, stdlib-only CLI (scripts/abitoads.py), so this is
# intentionally lean. Target the oldest interpreter we rely on; the code uses
# PEP 604 unions (`str | None`), which need 3.10+.
target-version = "py310"
line-length = 88

[lint]
# A pragmatic, not-overbearing selection:
#   E/W  pycodestyle   F  pyflakes       I  isort
#   UP   pyupgrade     B  bugbear        SIM  flake8-simplify
#   C4   comprehensions  RUF  ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[lint.isort]
known-first-party = ["abitoads"]

[format]
# Match Black-style defaults (double quotes, trailing commas).
quote-style = "double"
