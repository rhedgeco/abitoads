name: release

# Automatically publishes the wallpapers as GitHub release assets whenever the
# wallpapers directory changes on main. Each wallpaper becomes an individual
# asset, and the whole collection is also bundled into a single archive, so
# consumers can grab one file or everything at once. A SHA256SUMS file covers
# every asset. All of it is plain static files consumable by Nix (via fetchurl)
# or anything that can download a URL -- no Git LFS or flake required.
#
# The path filter means pushes that don't touch wallpapers/ (README, scripts,
# justfile, workflow edits, ...) do not cut a release.

on:
  push:
    branches: [main]
    paths:
      - "wallpapers/**"
  # Allow cutting a release by hand if ever needed.
  workflow_dispatch:

permissions:
  contents: write

# Don't let overlapping pushes race on creating releases.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # lfs: true so the checkout contains the real video files, not pointers.
      - uses: actions/checkout@v4
        with:
          lfs: true

      # A monotonic, human-readable version. Gives stable asset URLs like
      # .../releases/download/v7/Picnic.mp4
      - name: Compute version
        id: version
        run: echo "tag=v${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Bundle the whole collection so consumers can download everything at
      # once. We provide a gzipped tarball (.tar.gz) and a zip. The files are
      # already-compressed video, so the archives are mostly a convenience
      # single-file download rather than a space saving.
      - name: Build collection archives
        run: |
          tar -czf abitoads-wallpapers.tar.gz wallpapers
          ( cd wallpapers && zip -0 -r -X ../abitoads-wallpapers.zip . )

      # A checksums file lets consumers pin any asset (individual wallpapers or
      # the archives) by sha256 without downloading it first.
      - name: Generate SHA256SUMS
        run: |
          {
            ( cd wallpapers && sha256sum * )
            sha256sum abitoads-wallpapers.tar.gz abitoads-wallpapers.zip
          } > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            wallpapers/*
            abitoads-wallpapers.tar.gz
            abitoads-wallpapers.zip
            SHA256SUMS
