name: lfs-check

# Verifies on pull requests that wallpaper files are properly stored in Git LFS
# AND that their LFS objects were actually uploaded. This catches two common
# mistakes:
#   1. a video committed as a raw binary (not LFS-tracked), and
#   2. an LFS pointer whose backing object was never pushed (so everyone else,
#      and the release workflow, would get a broken/empty file).
#
# This works for fork contributions: we check out the PR's head repository and
# ref, so pointers and LFS objects are read from wherever the contributor
# actually pushed them. We intentionally use `pull_request` (not
# `pull_request_target`) so untrusted PR contents are never run with write
# permissions; checking out a public fork needs no special token.

on:
  pull_request:
    paths:
      - "wallpapers/**"
      - ".gitattributes"

permissions:
  contents: read

jobs:
  lfs-check:
    runs-on: ubuntu-latest
    steps:
      # Check out the PR HEAD (the contributor's fork/branch) WITHOUT smudging,
      # so we can first inspect the committed pointers. Using the head repo is
      # what makes fork LFS objects resolvable below.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: false

      # 1. Every file under wallpapers/ must be tracked by Git LFS, i.e. stored
      #    as a pointer rather than a raw binary blob.
      - name: Verify wallpapers are LFS-tracked
        run: |
          status=0
          for f in wallpapers/*; do
            [ -f "$f" ] || continue
            # A real LFS pointer is a small text file starting with this header.
            if ! head -c 50 "$f" | grep -q "git-lfs"; then
              echo "::error file=$f::'$f' is not a Git LFS pointer. Ensure .gitattributes tracks it and re-add it with git-lfs installed."
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Some wallpapers are not stored in Git LFS." >&2
            exit 1
          fi
          echo "All wallpapers are LFS-tracked."

      # 2. The LFS objects must actually exist on the PR head's LFS store. A
      #    fresh clone pulls objects from `origin` (here, the PR head repo), so
      #    doing the same faithfully reproduces the "pointer committed but object
      #    never pushed" failure: the pull cannot produce content that was never
      #    uploaded.
      - name: Verify LFS objects were uploaded
        run: git lfs pull --include "wallpapers/*"

      # 3. After pulling, confirm each file is now a real binary, not still a
      #    pointer (a belt-and-suspenders check that the smudge succeeded).
      - name: Verify files resolved to real content
        run: |
          status=0
          for f in wallpapers/*; do
            [ -f "$f" ] || continue
            if head -c 50 "$f" | grep -q "git-lfs"; then
              echo "::error file=$f::'$f' is still a Git LFS pointer after pull; its object is missing from the remote."
              status=1
            fi
          done
          [ "$status" -eq 0 ] && echo "All LFS objects downloaded successfully." || exit 1
