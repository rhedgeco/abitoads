[project]
name = "abitoads"
revision = "1.0"

# Secrets needed to publish wallpapers from the Steam Workshop to the GitHub
# release. These are declarations only -- no values live here, so this file is
# safe to commit.
#
# On the maintainer's server, values are stored outside any repo checkout at
# ~/.config/abitoads/.env (the `server` provider below) and injected into
# publish by `secretspec run`, so no secret values are written to the repo or
# exported into the job environment ahead of time. `just init-runner` stores
# them for you; to do it by hand:
#   secretspec set STEAM_USER --provider dotenv:~/.config/abitoads/.env
#   secretspec set GH_TOKEN   --provider dotenv:~/.config/abitoads/.env
[providers]
server = "dotenv:~/.config/abitoads/.env"

[profiles.default]
STEAM_USER = { description = "Steam account that owns Wallpaper Engine", required = true, providers = ["server"] }
GH_TOKEN = { description = "GitHub token with contents:write on this repo (for gh)", required = true, providers = ["server"] }
